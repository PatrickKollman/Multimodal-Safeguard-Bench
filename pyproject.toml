[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "msbench"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "transformers>=4.57,<4.58",
    "Pillow>=10.1,<13",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "accelerate>=0.33",
    "hf_transfer>=0.1",
    "protobuf>=3.20",
    "sentencepiece>=0.1.99",
    "bitsandbytes>=0.44",
    "tqdm>=4.66",
    "numpy>=1.26",
    "datasets>=2.20",
    "optuna>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
